<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SoundScope</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tabs_style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  </head>
  <body>
    <div class="container">
        <section class="panel">
             <!-- create user profile -->
             {% include 'user_profile.html' %}
        </section>

        <section class="panel">
          <!-- show popularity screen -->
          {% include 'popularity.html' %}
     </section>

        <section class="panel tabbed">
            <h2 class="subtitle is-2 top-title"> Your Top Artists </h2>
            <!-- list out top artists -->
            {% include 'top_artists_menu.html' %}

        </section>

        <section class="panel tabbed">
            <h2 class="subtitle is-2 top-title"> Your Top Tracks </h2>
            <!-- list out top tracks -->
            {% include 'top_tracks_menu.html' %}
        </section>

    </div>

    <!-- create currently playing player + down arrow animation -->
    {% include 'static.html' %}

    <script src="{{ url_for('static', filename='js/scroll_control.js') }}"></script>
    <script src="{{ url_for('static', filename='js/update_song.js') }}"></script>
    <script src="{{ url_for('static', filename='js/top_tabs.js') }}"></script>
    <script src="{{ url_for('static', filename='js/playback.js') }}"></script>
</body>
</html>
